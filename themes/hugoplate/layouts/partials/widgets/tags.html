<!-- tags -->
{{ if isset site.Taxonomies "tags" }}
  {{ if not (eq (len site.Taxonomies.tags) 0) }}
    <div class="mb-8">
      <p class="mb-1 text-xs font-semibold uppercase tracking-widest text-primary dark:text-darkmode-primary">Filter</p>
      <h5 class="mb-5 font-bold text-text-dark dark:text-darkmode-text-dark">{{ T "tags" }}</h5>
      <div class="flex flex-wrap gap-2">
        {{ range $name, $items := site.Taxonomies.tags }}
          <a class="rounded-full border border-border dark:border-darkmode-border px-3 py-1 text-xs font-medium text-text dark:text-darkmode-text hover:border-primary dark:hover:border-darkmode-primary hover:text-primary dark:hover:text-darkmode-primary transition-all duration-200"
          href="{{ .Page.RelPermalink }}">
          {{ .Page.Title }}
        </a>
        {{ end }}
      </div>
    </div>
  {{ end }}
{{ end }}
