<footer class="bg-light dark:bg-darkmode-light border-t border-border dark:border-darkmode-border">
  <div class="container">
    <div class="flex flex-col items-center gap-6 py-10 lg:flex-row lg:justify-between">
      <!-- Brand -->
      <div class="text-center lg:text-left">
        <a class="navbar-brand inline-block h-8 mb-2" href="{{ site.Home.RelPermalink }}" aria-label="Purnama Anaking">
          {{ partial "components/logo" (dict "Class" "h-8") }}
        </a>
        <p class="font-secondary text-xs text-text-light dark:text-darkmode-text-light">Software Engineer & Lecturer · Indonesia</p>
      </div>
      <div class="flex flex-col items-center gap-6 lg:flex-row lg:gap-10">
      <!-- Nav Links -->
      <div class="text-center">
        <ul class="flex justify-center gap-6">
          {{ range site.Menus.footer }}
          <li>
            <a class="text-base lg:text-sm text-text dark:text-darkmode-text hover:text-primary dark:hover:text-darkmode-primary transition-colors font-medium"
              {{ if findRE `^http` .URL }}target="_blank" rel="noopener"{{ end }}
              href="{{ if findRE `^#` .URL }}{{ if not $.IsHome }}{{ site.Home.RelPermalink }}{{ end }}{{ .URL }}{{ else }}{{ .URL | relLangURL }}{{ end }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      </div>
      <!-- Social Icons -->
      <div class="text-center">
        <ul class="social-icons justify-center lg:justify-end">
          {{ range site.Data.social.main }}
          <li>
            <a target="_blank" aria-label="{{ .name }}" rel="nofollow noopener" href="{{ .link | safeURL }}">
              <i class="{{ .icon }}"></i>
            </a>
          </li>
          {{ end }}
        </ul>
      </div>
      </div>
    </div>
  </div>
  <!-- Copyright -->
  <div class="border-t border-border dark:border-darkmode-border py-5">
    <div class="container text-center">
      <p class="font-secondary text-xs text-text-light dark:text-darkmode-text-light">
        &lt;/&gt; &copy; {{ now.Year }} Purnama Anaking. All rights reserved.
      </p>
    </div>
  </div>
</footer>
